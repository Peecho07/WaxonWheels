name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/zipfile-creation-processing-k5nkzp
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Requires Settings > Pages > Source = "GitHub Actions". The workflow
      # token is not allowed to create the Pages site itself, so that toggle
      # has to be set by hand once.
      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
