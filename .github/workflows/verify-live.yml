# Temporary: smoke-tests the deployed Pages site from a runner, which (unlike
# the authoring sandbox) is allowed to reach *.github.io. Delete after use.
name: Verify live site

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check pages, assets and 404
        run: |
          set -uo pipefail
          BASE=https://peecho07.github.io/WaxonWheels
          fail=0

          check() { # path expected_status expected_type_substring
            code=$(curl -s -o /tmp/body -w '%{http_code}' -L --max-time 30 "$BASE/$1")
            type=$(curl -s -o /dev/null -w '%{content_type}' -L --max-time 30 "$BASE/$1")
            size=$(stat -c %s /tmp/body 2>/dev/null || echo 0)
            if [ "$code" = "$2" ] && case "$type" in *"$3"*) true;; *) false;; esac; then
              printf '  ok    %-34s %s  %-24s %sB\n' "$1" "$code" "$type" "$size"
            else
              printf '  FAIL  %-34s %s  %-24s %sB (wanted %s / %s)\n' "$1" "$code" "$type" "$size" "$2" "$3"
              fail=$((fail+1))
            fi
          }

          echo "== pages =="
          for p in "" index.html our-company.html detailing-services.html \
                   gallery.html gift-certificates.html contact.html; do
            check "$p" 200 text/html
          done

          echo "== assets =="
          check assets/styles.css 200 text/css
          check assets/site.js    200 javascript
          check sitemap.xml       200 xml
          check robots.txt        200 text/plain

          echo "== a sample of the images =="
          for i in header.jpg blackcar.jpg white-lambo1.jpg IMAG0026.jpg yellow-beauty1-700x525.jpg; do
            check "assets/images/$i" 200 image/jpeg
          done

          echo "== custom 404 =="
          check no-such-page-here 404 text/html
          grep -q "That page took a wrong turn" /tmp/body \
            && echo "  ok    custom 404 body served" \
            || { echo "  FAIL  404 body is not the custom page"; fail=$((fail+1)); }

          echo "== every image referenced by the live HTML =="
          curl -s -L "$BASE/gallery.html" > /tmp/g.html
          n=0; bad=0
          for u in $(grep -oh '\(src\|data-full\)="assets/images/[^"]*"' /tmp/g.html | sed 's/.*="//;s/"//' | sort -u); do
            c=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$BASE/$u")
            n=$((n+1)); [ "$c" = "200" ] || { echo "  FAIL $c $u"; bad=$((bad+1)); }
          done
          echo "  gallery images checked: $n, non-200: $bad"
          fail=$((fail+bad))

          echo "----"
          [ "$fail" -eq 0 ] && echo "ALL CHECKS PASSED" || { echo "$fail CHECK(S) FAILED"; exit 1; }
